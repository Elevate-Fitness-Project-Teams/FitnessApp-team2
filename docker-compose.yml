services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    hostname: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Youssef@salah1
    ports:
      - "1433:1433"
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Youssef@salah1" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    hostname: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  authenticationservice:
    image: ${DOCKER_REGISTRY-}authenticationservice
    build:
      context: .
      dockerfile: AuthenticationService/Dockerfile
    ports:
      - "8089:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=AuthenticationDb;User Id=sa;Password=Youssef@salah1;TrustServerCertificate=True;
      - RabbitMq__Host=rabbitmq
      - RabbitMq__VirtualHost=/
      - RabbitMq__Username=guest
      - RabbitMq__Password=guest
      - Jwt__PrivateKeyPath=/app/keys/auth-service-private.pem
      - Jwt__PublicKeyPath=/app/keys/auth-service-public.pem
      - Jwt__KeyId=elevate-fitness-key-1
    volumes:
      - ./Keys:/app/keys:ro
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  fitnesscalculationservice:
    image: ${DOCKER_REGISTRY-}fitnesscalculationservice
    build:
      context: .
      dockerfile: FitnessCalculationService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=FitnessCalculationDb;User Id=sa;Password=Youssef@salah1;TrustServerCertificate=True;
      - RabbitMq__Host=rabbitmq
      - Redis__ConnectionString=redis:6379
      - Jwt__PublicKeyPath=/app/keys/auth-service-public.pem
      - Jwt__KeyId=elevate-fitness-key-1
    volumes:
      - ./Keys/auth-service-public.pem:/app/keys/auth-service-public.pem:ro
    ports:
      - "8091:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_healthy

  nutritionservice:
    image: ${DOCKER_REGISTRY-}nutritionservice
    build:
      context: .
      dockerfile: NutritionService/Dockerfile
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=NutritionDb;User Id=sa;Password=Youssef@salah1;TrustServerCertificate=True;
      - ServiceUrls__FitnessCalculationService=http://fitnesscalculationservice:8080
      - Jwt__PublicKeyPath=/app/keys/auth-service-public.pem
      - Jwt__KeyId=elevate-fitness-key-1
    volumes:
      - ./Keys/auth-service-public.pem:/app/keys/auth-service-public.pem:ro
    depends_on:
      sqlserver:
        condition: service_healthy

  progresstrackingservice:
    image: ${DOCKER_REGISTRY-}progresstrackingservice
    build:
      context: .
      dockerfile: ProgressTrackingService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ProgressTrackingDb;User Id=sa;Password=Youssef@salah1;TrustServerCertificate=True;
      - RabbitMq__Host=rabbitmq
      - RabbitMq__VirtualHost=/
      - RabbitMq__Username=guest
      - RabbitMq__Password=guest
      - WorkoutService__BaseUrl=http://workoutservice:8080
      - Redis__ConnectionString=redis:6379
      - Jwt__PublicKeyPath=/app/keys/auth-service-public.pem
      - Jwt__KeyId=elevate-fitness-key-1
    volumes:
      - ./Keys/auth-service-public.pem:/app/keys/auth-service-public.pem:ro
    ports:
      - "8090:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_healthy

  userprofileservice:
    image: ${DOCKER_REGISTRY-}userprofileservice
    build:
      context: .
      dockerfile: UserProfileService/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=UserProfileDb;User Id=sa;Password=Youssef@salah1;TrustServerCertificate=True;
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__VirtualHost=/
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - Jwt__PublicKeyPath=/app/keys/auth-service-public.pem
      - Jwt__KeyId=elevate-fitness-key-1
    volumes:
      - ./Keys/auth-service-public.pem:/app/keys/auth-service-public.pem:ro
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  workoutservice:
    image: ${DOCKER_REGISTRY-}workoutservice
    build:
      context: .
      dockerfile: WorkoutService/Dockerfile
    ports:
      - "8085:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=WorkoutDb;User Id=sa;Password=Youssef@salah1;TrustServerCertificate=True;
      - Jwt__PublicKeyPath=/app/keys/auth-service-public.pem
      - Jwt__KeyId=elevate-fitness-key-1
    volumes:
      - ./Keys/auth-service-public.pem:/app/keys/auth-service-public.pem:ro
    depends_on:
      sqlserver:
        condition: service_healthy

  apigateway:
    image: ${DOCKER_REGISTRY-}apigateway
    build:
      context: .
      dockerfile: ApiGateway/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - Jwt__PublicKeyPath=/app/keys/auth-service-public.pem
      - Jwt__KeyId=elevate-fitness-key-1
    volumes:
      - ./Keys/auth-service-public.pem:/app/keys/auth-service-public.pem:ro
    depends_on:
      - authenticationservice
      - fitnesscalculationservice
      - nutritionservice
      - progresstrackingservice
      - userprofileservice
      - workoutservice